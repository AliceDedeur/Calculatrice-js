<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice Js</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Limelight&family=Modak&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>
        
    <div class="pave">
        <div class="resultat">
            <p id="result">0</p>
        </div>
        <div class="touches">
            <button class="btn" data-value="1">1</button>
            <button class="btn" data-value="2">2</button>
            <button class="btn" data-value="3">3</button>
            <button class="btn" data-value="/">:</button>

            <button class="btn" data-value="4">4</button>
            <button class="btn" data-value="5">5</button>
            <button class="btn" data-value="6">6</button>
            <button class="btn" data-value="*">×</button>

            <button class="btn" data-value="7">7</button>
            <button class="btn" data-value="8">8</button>
            <button class="btn" data-value="9">9</button>
            <button class="btn" data-value="-">-</button>
            
            <button class="btn" data-value="-/+">-/+</button>
            <button class="btn" data-value=".">.</button>
            <button class="btn" data-value="0">0</button>
            <button class="btn" data-value="+">+</button>

            <button class="btn" data-value="%">%</button>
            <button class="btn" data-value="**2">x²</button>
            <button id="btnDell" class="btn" data-value="DELL">DELL</button>
            <button class="btn" data-value="C">C</button>

            <button id="btnEgale" class="btn" data-value="=">=</button>
        </div>
        <div>
            <p id="historique"></p>
        </div>
    </div>           

    <script src="js/script.js"></script>
</body>
</html>
